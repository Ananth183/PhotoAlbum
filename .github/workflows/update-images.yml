name: Update image list

on:
  push:
    paths:
      - "Images/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Images/images.json and captions.json
        shell: pwsh
        run: ./update-images.ps1
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain Images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Images/images.json Images/captions.json
            git commit -m "Update image list"
            git push
          fi
