<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1620">
<title>Chandana's Pregnancy Journey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="album-heading">
    <p class="eyebrow">Chandana's pregnancy journey</p>
    <h1>Waiting <span>&amp;</span> Wonder</h1>
    <p class="heading-note">Nine months of love, one page at a time.</p>
  </header>
  <section class="album-view" aria-label="Interactive photo album">
    <div class="book" id="book" role="group" aria-label="Photo album book"></div>
  </section>
  <p class="rotate-hint"><span aria-hidden="true">↻</span> Rotate your phone for full-size photos</p>
  <nav class="controls" aria-label="Album navigation">
    <button id="prev" type="button" aria-label="Previous spread">&#8592; <span>Previous</span></button>
    <span id="count" role="status" aria-live="polite"></span>
    <button id="next" type="button" aria-label="Next spread"><span>Next</span> &#8594;</button>
  </nav>
  <div class="extras">
    <button id="autoplay" class="fs-button" type="button" aria-pressed="true" aria-label="Auto-flip" title="Auto-flip">&#10074;&#10074; <span>Pause</span></button>
    <button id="fullscreen" class="fs-button" type="button" aria-pressed="false" aria-label="Full screen" title="Full screen">&#9974; <span>Full screen</span></button>
  </div>
  <p class="keyboard-hint">Use arrow keys, swipe, or tap a page to turn</p>
</main>
<script src="script.js"></script>
</body>
</html>
